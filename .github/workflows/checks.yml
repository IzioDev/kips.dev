name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-

      - name: Cache Rust check outputs
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-quality-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**/*.rs') }}
          restore-keys: |
            cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-quality-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --locked --all-targets --all-features

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend tooling
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Validate frontend and Wrangler configuration
        shell: bash
        run: |
          node --check site/static/site.js
          node --check site/static/tinysearch.js
          node <<'NODE'
          const fs = require("node:fs");
          const configs = [
            ["cloudflare/kips/wrangler.jsonc", "kips-dev", "../../dist/kips"],
            ["cloudflare/kccs/wrangler.jsonc", "kccs-dev", "../../dist/kccs"],
          ];
          for (const [path, name, output] of configs) {
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            if (config.name !== name || config.pages_build_output_dir !== output) {
              throw new Error(`Unexpected Pages configuration in ${path}`);
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(config.compatibility_date)) {
              throw new Error(`Invalid compatibility date in ${path}`);
            }
          }
          NODE

  build:
    name: Build production sites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-

      - name: Cache production Rust outputs
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-site-build-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'src/**/*.rs') }}
          restore-keys: |
            cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-site-build-

      - name: Cache pinned site tools
        id: site-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.install-action/bin/zola
            ~/.cargo/bin/tinysearch
          key: site-tools-v1-${{ runner.os }}-${{ runner.arch }}-zola-0.23.4-tinysearch-0.11.0-rust-1.96.0

      - name: Add cached site tools to PATH
        shell: bash
        run: echo "$HOME/.install-action/bin" >> "$GITHUB_PATH"

      - name: Install Zola
        if: steps.site-tools.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Install Tinysearch
        if: steps.site-tools.outputs.cache-hit != 'true'
        run: cargo install tinysearch --version 0.11.0 --locked --features bin

      - name: Select source cache generation
        id: source-cache
        shell: bash
        run: echo "week=$(date -u +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Cache upstream proposal checkouts
        uses: actions/cache@v4
        with:
          path: .sources/
          key: proposal-sources-v1-${{ runner.os }}-${{ steps.source-cache.outputs.week }}
          restore-keys: |
            proposal-sources-v1-${{ runner.os }}-

      - name: Import current proposals
        run: cargo run --locked --release

      - name: Build both static sites
        run: |
          zola --root .generated/kips build --force --output-dir "$GITHUB_WORKSPACE/dist/kips"
          zola --root .generated/kccs build --force --output-dir "$GITHUB_WORKSPACE/dist/kccs"
          tinysearch --release -m wasm -p dist/kips/tinysearch dist/kips/search_index.en.json
          tinysearch --release -m wasm -p dist/kccs/tinysearch dist/kccs/search_index.en.json
          rm -f dist/kips/search_index.en.json dist/kips/tinysearch.toml
          rm -f dist/kccs/search_index.en.json dist/kccs/tinysearch.toml

      - name: Validate generated output
        shell: bash
        run: |
          test -s dist/kips/index.html
          test -s dist/kccs/index.html
          test -s dist/kips/tinysearch/tinysearch_engine.wasm
          test -s dist/kccs/tinysearch/tinysearch_engine.wasm
          test ! -e dist/kips/search_index.en.json
          test ! -e dist/kccs/search_index.en.json
          grep -q 'href=/1/' dist/kips/index.html
          grep -q 'href=/0/' dist/kccs/index.html
          grep -q 'https://kccs.dev' dist/kips/index.html
          grep -q 'https://kips.dev' dist/kccs/index.html
